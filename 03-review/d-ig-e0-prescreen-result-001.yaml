        capability_name: Create orders
        removal_effect: "Removing Food leaves the documented order creation path without the directly referenced sellable/menu object used by order_items.foodId."
        loss_type: UNREFERENCABLE
        compensation_attempt:
          - semantic_layers: [Role, Domain, Commercial Unit]
            result: "Could describe a selling role/domain or transaction unit, but the current capability evidence still requires a stable directly referenced object for order_items.foodId."
          - semantic_layers: [Classification, Quantity, UOM]
            result: "Cannot replace the stable business reference required by the order item."
        compensation_result: LOSS_NOT_COMPENSATED
        evidence_reference:
          - "03-review/d-ig-e0-candidate-enumeration-001.yaml C-001"
