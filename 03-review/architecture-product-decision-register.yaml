  DEC-001:
    title: "Warehouse 是否需要独立管理"
    category: PRODUCT
    question: "Warehouse 是否需要独立的管理表和生命周期？"
    current_reality: |
      无独立 warehouses 表。inventory.warehouse_id 通过引用存在，
      但 warehouse 可能是硬编码或配置项。foundation-map.md 标记为
      MISSING (LOW confidence)。inventory 表和 employees 表都有
      warehouseId 字段，但无对应的 master data。
    why_decision_needed: |
      采购入库、库存调拨、出库等场景需要区分不同仓库。当前无独立仓库主数据，
      导致无法独立管理仓库属性（名称、地址、类型）。未来可能需要多仓库管理。
    options:
      A_config: "作为配置项管理（不建表）"
        pros: "简单，适用于固定数量仓库"
        cons: "无法独立维护，扩展性差"
      B_independent_table: "创建 warehouses 独立表"
        pros: "完整生命周期，支持多仓库，可扩展"
        cons: "增加数据维护成本"
    affected_domains: [Inventory, Procurement, Management Core]
    affected_objects: [inventory, employees, purchase_stockins]
    upstream_impact: "采购入库、收货确认需指定仓库"
    downstream_impact: "库存查询需按仓库筛选，报表需按仓库统计"
    recommendation: "B_independent_table"
    decision_status: OPEN
    evidence:
      - "foundation-map.md §10: Warehouse 标记为 MISSING"
      - "db-reality-map.md §5: inventory.warehouse_id 存在但无独立表"
      - "data-design-map.md §5.2 #12: 缺失主源"

  DEC-002:
    title: "Unit 是否需要统一管理"
    category: PRODUCT
    question: "计量单位是否需要独立的 units 表管理？"
    current_reality: |
      无独立 units 表。foods.unit 字段默认值为 '份'，material_archives.unit
      存储单位字符串。单位可能是枚举值或硬编码在代码中。foundation-map.md
      标记为 MISSING (LOW confidence)。
    why_decision_needed: |
      菜品和物料使用不同单位（份、斤、kg、L等），未来可能需要单位换算
      （如1斤=500g）。无统一管理导致单位定义分散、不一致。
    options:
      A_enum: "保持枚举/硬编码"
        pros: "简单，无额外维护"
        cons: "无法动态扩展，单位换算困难"
      B_independent_table: "创建 units 独立表"
        pros: "统一管理，支持单位换算"
        cons: "增加数据维护成本"
    affected_domains: [Product, Inventory, Procurement]
    affected_objects: [foods, material_archives, inventory]
    upstream_impact: "物料采购需指定单位，菜品销售需指定单位"
    downstream_impact: "库存统计需按单位聚合，财务需按单位换算"
    recommendation: "A_enum (当前阶段)"
    decision_status: OPEN
    evidence:
      - "foundation-map.md §15: Unit 标记为 MISSING"
      - "data-design-map.md §3.1: foods.unit 默认 '份'"

  DEC-003:
    title: "PaymentMethod 是否需要统一管理"
    category: PRODUCT
    question: "支付方式是否需要独立的 payment_methods 表管理？"
    current_reality: |
      无独立 payment_methods 表。支付方式可能是枚举值（现金/微信/支付宝/
      会员支付），存储在 orders 或 payment 表字段中。foundation-map.md
      标记为 MISSING (LOW confidence)。
    why_decision_needed: |
      支付方式需要可扩展（新增支付渠道）、可配置（不同门店支持不同方式）。
      无统一管理导致支付方式定义分散。
    options:
      A_enum: "保持枚举/硬编码"
        pros: "简单，无额外维护"
        cons: "新增支付方式需改代码"
      B_independent_table: "创建 payment_methods 独立表"
        pros: "动态管理，支持多门店配置"
        cons: "增加数据维护成本"
    affected_domains: [Finance, Order, Marketing]
    affected_objects: [orders, payment, receipt]
    upstream_impact: "下单需选择支付方式，收银需支持多种支付"
    downstream_impact: "财务对账需按支付方式统计，报表需按支付方式分类"
    recommendation: "A_enum (当前阶段)"
    decision_status: OPEN
    evidence:
      - "foundation-map.md §17: PaymentMethod 标记为 MISSING"
      - "permission-data-scope-map.md §5: 公开端点包含支付相关接口"

  DEC-004:
    title: "Customer 是否需要独立于 Member"
    category: PRODUCT
    question: "Customer（客户）是否需要独立于 Member（会员）管理？"
    current_reality: |
      无独立 customers 表。orders.customerId 关联 members 表，
      receivables.customerId 也关联 members 表。Customer 可能与
      Member 合并。foundation-map.md 标记为 MISSING (LOW confidence)。
    why_decision_needed: |
      业务上可能存在非会员客户（散客），需要区分会员和非会员。
      当前强制关联 member 表，可能导致散客无法下单。
    options:
      A_merge: "Customer = Member（合并）"
        pros: "简单，所有客户都是会员"
        cons: "无法处理散客场景"
      B_separate: "Customer 独立于 Member"
        pros: "支持散客和会员两种模式"
        cons: "增加数据复杂度，需维护两套客户信息"
      C_alias: "Customer 为 Member 的别名视图"
        pros: "保持合并，但提供客户视角"
        cons: "本质还是合并，散客问题未解决"
    affected_domains: [Order, Finance, Marketing]
    affected_objects: [orders, receivables, members]
    upstream_impact: "下单时需确认客户身份，财务需区分客户类型"
    downstream_impact: "会员管理需区分散客，报表需按客户类型统计"
    recommendation: "A_merge (当前阶段，散客需求待确认)"
    decision_status: OPEN
    evidence:
      - "foundation-map.md §18: Customer 标记为 MISSING"
      - "cross-domain-coordination-matrix.md §2.2: Member 写入涉及 MiniProgram"
      - "conflict-registry.md CONFLICT-MF-002: 需要 Product Decision"

  DEC-005:
    title: "Price 是否需要统一管理"
    category: PRODUCT
    question: "价格体系是否需要独立的 price_list 表统一管理？"
    current_reality: |
      无独立价格表。foods.price 存储菜品价格，material_archives.price
      存储物料价格，分散在各业务表中。foundation-map.md 标记为
      MISSING (LOW confidence)。
    why_decision_needed: |
      当前价格随对象创建，无独立价格历史、价格策略管理。
      未来可能需要价格审计、价格变更记录、多级价格（会员价、批发价）。
    options:
      A_inline: "价格内联在业务表中"
        pros: "简单，查询直接"
        cons: "无价格历史，无法审计价格变更"
      B_price_list: "创建 price_list 统一管理"
        pros: "价格历史可追溯，支持多级价格"
        cons: "增加查询复杂度"
    affected_domains: [Product, Order, Procurement]
    affected_objects: [foods, material_archives, orders, purchase_orders]
    upstream_impact: "菜品定价、物料采购价需从价格表获取"
    downstream_impact: "订单价格需记录快照，财务成本需按价格计算"
    recommendation: "A_inline (当前阶段)"
    decision_status: OPEN
    evidence:
      - "foundation-map.md §19: Price 标记为 MISSING"
      - "data-design-map.md §3.1: foods.price 为 decimal(10,2)"

