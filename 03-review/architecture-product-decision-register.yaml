  DEC-006:
    title: "food/foods 如何统一"
    category: DATA_MODEL
    question: "food（旧表）和 foods（新表）如何完成统一？"
    current_reality: |
      food 和 foods 双表并存，下单/退款/超时同时写两表（双写）。
      truth-conflict-map.md §7: foods 为真相源，food 为兼容旧模块的过渡方案。
      foundation-map.md: foods 为唯一真相源 (HIGH confidence)。
    why_decision_needed: |
      双写导致库存/状态可能不一致，写入顺序依赖。废弃 food 表写入
      需要确认旧模块（POS legacy）是否已完全迁移。
    options:
      A_keep_dual: "保持双写"
        pros: "兼容旧模块，无迁移风险"
        cons: "持续的不一致风险，技术债"
      B_migrate_and_drop: "完成迁移后废弃 food 表"
        pros: "消除不一致，简化数据模型"
        cons: "需要评估旧模块迁移状态"
    affected_domains: [Product, Order, POS]
    affected_objects: [food, foods, orders, order_items]
    upstream_impact: "菜品管理需统一入口，订单需统一查询菜品"
    downstream_impact: "POS 终端需迁移至 foods 表，库存需统一"
    recommendation: "B_migrate_and_drop"
    decision_status: RECOMMENDED
    evidence:
      - "truth-conflict-map.md §7: foods 为真相源"
      - "data-design-map.md §5.1 #1: P0 级问题"
      - "legacy-map.md §1: food 标记为已废弃"

  DEC-007:
    title: "金额单位如何统一（分 or 元）"
    category: DATA_MODEL
    question: "全链路金额单位统一为「分」还是「元」？"
    current_reality: |
      新表统一用「分」存储（orders.amount, finance_records.amount），
      但 tax_record、account_balance 等遗留表仍用「元」。
      truth-conflict-map.md §1: 跨表 JOIN 时单位不一致，差 100 倍。
    why_decision_needed: |
      金额单位双轨导致跨表查询必须显式转换，极易出错。
      新增代码如果不知道单位约定，会产生严重 Bug。
    options:
      A_yuan: "统一为「元」"
        pros: "符合人类直觉，前端展示友好"
        cons: "需要修改所有新表，涉及面广"
      B_fen: "统一为「分」"
        pros: "避免浮点精度问题，新表已是「分」"
        cons: "前端展示需转换"
      C_hybrid: "保持现状，添加转换层"
        pros: "改动最小"
        cons: "持续风险，每处查询都需转换"
    affected_domains: [Finance, Order, Procurement, Inventory]
    affected_objects: [orders, finance_records, payables, tax_record, account_balance]
    upstream_impact: "所有涉及金额的接口需统一单位"
    downstream_impact: "报表、对账、税务申报需明确单位"
    recommendation: "B_fen"
    decision_status: RECOMMENDED
    evidence:
      - "truth-conflict-map.md §1: 已裁决新表以「分」为准"
      - "data-design-map.md §5.1 #5: P0 级问题"
      - "data-design-map.md §6.3: 金额字段类型 decimal(10,2)，单位为分"

  DEC-008:
    title: "订单状态机如何统一"
    category: DATA_MODEL
    question: "订单三套状态机（order_status, payment_status, legacy_status）如何统一？"
    current_reality: |
      order_status (0-6)、payment_status (0-3)、legacy_status (-1~7)
      三套并存。truth-conflict-map.md §5: PADR 裁决三套并存，
      每个字段有独立生命周期。sales_order 也有独立状态且无映射。
    why_decision_needed: |
      状态机分散导致状态流转逻辑难以维护，跨表状态可能不一致。
      新增业务场景需同时更新三套状态，容易遗漏。
    options:
      A_keep_triple: "保持三套并存（PADR 裁决）"
        pros: "符合历史裁决，改动最小"
        cons: "持续复杂度"
      B_unified_sm: "建立统一状态机"
        pros: "简化状态管理，一致性好"
        cons: "改动大，需重新设计状态映射"
      C_migration_plan: "制定迁移计划，逐步统一"
        pros: "渐进式改进，风险可控"
        cons: "需要明确迁移路径和时间表"
    affected_domains: [Order, POS, Finance]
    affected_objects: [orders, sales_order]
    upstream_impact: "下单、支付、退款等操作需维护多套状态"
    downstream_impact: "订单查询、对账、报表需多状态联合筛选"
    recommendation: "C_migration_plan"
    decision_status: PARTIAL
    evidence:
      - "truth-conflict-map.md §5: PADR 裁决三套并存"
      - "state-machine-map.md §1.5: sales_order 无映射"
      - "data-design-map.md §5.1 #4: P0 级问题"

  DEC-009:
    title: "stores/stores_new 如何统一"
    category: DATA_MODEL
    question: "stores（旧表）和 stores_new（新表）如何完成统一？"
    current_reality: |
      stores_new 为唯一真相源，stores 仅用于兼容旧查询。
      truth-conflict-map.md §4: 新旧表并存，字段结构不同。
      foundation-map.md: Store.truth_source = stores_new (HIGH confidence)。
    why_decision_needed: |
      读错表导致门店信息不一致（地址、经营范围、状态等）。
      需确认旧模块是否已完全迁移至 stores_new。
    options:
      A_keep_both: "保持双表"
        pros: "兼容旧模块"
        cons: "持续的不一致风险"
      B_migrate_and_drop: "完成迁移后废弃 stores 表"
        pros: "消除不一致，简化数据模型"
        cons: "需要评估旧模块迁移状态"
    affected_domains: [Management Core, POS, Employee, Inventory]
    affected_objects: [stores, stores_new, employees, orders]
    upstream_impact: "门店管理需统一入口"
    downstream_impact: "所有引用门店的模块需迁移到 stores_new"
    recommendation: "B_migrate_and_drop"
    decision_status: PARTIAL
    evidence:
      - "truth-conflict-map.md §4: stores_new 为唯一真相源"
      - "data-design-map.md §5.2 #8: P1 级问题"
      - "legacy-map.md §1: stores 标记为已废弃"

  # ==========================================================================
  # Architecture 决策
  # ==========================================================================

  DEC-010:
    title: "跨域数据所有权如何划分"
    category: ARCHITECTURE
    question: "Order、Inventory 等跨域对象的数据所有权如何明确划分？"
    current_reality: |
      cross-domain-coordination-matrix.md §5.1: Order 的 OWNER 为 POS 和
      MiniProgram（多端写入），Inventory 的 OWNER 为 Inventory 模块，
      StoreInventory 的 OWNER 为 POS。
      conflict-registry.md CONFLICT-XDO-001: Order 多端写入时主数据所有权不明确。
    why_decision_needed: |
      多端写入同一表可能导致数据冲突和不一致，影响订单数据准确性和财务对账。
      需明确每个业务对象的唯一OWNER，其他终端只读或通过事件更新。
    options:
      A_centralized: "集中式所有权（单一OWNER）"
        pros: "简单明确，一致性好"
        cons: "可能增加跨域调用"
      B_distributed: "分布式所有权（多OWNER + 冲突解决）"
        pros: "灵活性好，各端自治"
        cons: "冲突解决复杂"
      C_event_driven: "事件驱动（OWNER + EVENT CONSUMER）"
        pros: "松耦合，可扩展"
        cons: "事件可靠性要求高"
    affected_domains: [Order, Inventory, POS, Mini Program]
    affected_objects: [orders, order_items, inventory, store_inventory]
    upstream_impact: "需明确数据写入入口和事件触发点"
    downstream_impact: "数据一致性依赖事件可靠性"
    recommendation: "C_event_driven"
    decision_status: OPEN
    evidence:
      - "cross-domain-coordination-matrix.md §2.2: Order 为多端写入"
      - "conflict-registry.md CONFLICT-XDO-001: Critical 级冲突"
      - "project-master-registry.yaml §cross_domain_coordination: 各域角色定义"

  DEC-011:
    title: "事件驱动架构是否需要加强"
    category: ARCHITECTURE
    question: "当前 RabbitMQ 事件驱动是否需要加强可靠性保障？"
    current_reality: |
      project-master-registry.yaml §events: 定义了 10+ 领域事件
      （OrderCreated, OrderCompleted, PurchaseStockIn 等）。
      cross-domain-coordination-matrix.md §7.1: 事件驱动架构存在事件丢失风险。
    why_decision_needed: |
      跨域协调依赖事件驱动，如果事件丢失会导致数据不一致
      （如订单完成但财务未收到事件）。
    options:
      A_current: "保持当前实现"
        pros: "简单，无额外开发"
        cons: "事件丢失风险"
      B_enhanced: "加强事件可靠性（持久化+重试+死信）"
        pros: "事件不丢失，数据一致"
        cons: "增加复杂度和运维成本"
      C_saga: "引入 Saga 模式"
        pros: "完整的分布式事务保障"
        cons: "复杂度高，学习成本"
    affected_domains: [Order, Inventory, Finance, Procurement]
    affected_objects: [所有事件相关的业务对象]
    upstream_impact: "事件生产者需确保事件持久化"
    downstream_impact: "事件消费者需实现幂等和重试"
    recommendation: "B_enhanced"
    decision_status: OPEN
    evidence:
      - "project-master-registry.yaml §events: 10+ 领域事件"
      - "cross-domain-coordination-matrix.md §7.1: 事件丢失风险"
      - "event-job-map.md: 事件消费链路"

  DEC-012:
    title: "Legacy 系统如何隔离"
    category: ARCHITECTURE
    question: "遗留代码（Legacy 服务、控制器、表）如何隔离和清理？"
    current_reality: |
      legacy-map.md: 8 个 Legacy 服务实现、13 个 Legacy 控制器、
      8 个 Legacy 数据库表。包含死体系（voucher_header/line）、
      直接数据库写入（DatabaseFixConfig）。
    why_decision_needed: |
      Legacy 代码与新代码混合，增加维护成本和 Bug 风险。
      直接数据库写入绕过 ORM，可能导致数据不一致。
    options:
      A_little_by_little: "渐进式清理"
        pros: "风险可控，不影响业务"
        cons: "清理周期长"
      B_big_bang: "一次性大清理"
        pros: "快速消除技术债"
        cons: "风险高，可能影响业务"
      C_isolation_layer: "建立隔离层"
        pros: "新旧代码解耦"
        cons: "增加架构复杂度"
    affected_domains: [Finance, System, Inventory]
    affected_objects: [voucher_header, voucher_line, stores, food, product]
    upstream_impact: "需评估各 Legacy 组件的依赖关系"
    downstream_impact: "清理后需验证所有依赖模块"
    recommendation: "A_little_by_little"
    decision_status: PARTIAL
    evidence:
      - "legacy-map.md §1-7: Legacy 组件清单"
      - "legacy-map.md §建议处理优先级: 高/中/低优先级划分"

  # ==========================================================================
  # Security 决策
  # ==========================================================================

  DEC-013:
    title: "裸接口权限如何归属"
    category: SECURITY
    question: "25 个无 @RequiresPermission 注解的裸接口如何分配权限码？"
    current_reality: |
      permission-data-scope-map.md §7.1: 25 个方法无权限注解保护，
      涉及 self-purchase (6), plan-items (7), tasks (12) 三个接口域。
      这些接口存在安全缺口，任何用户都可访问。
    why_decision_needed: |
      裸接口可能导致未授权访问，违反最小权限原则。
      需要为这些接口分配正确的域归属和权限码。
    options:
      A_assign_existing: "分配已有权限码"
        pros: "复用现有权限体系"
        cons: "可能语义不匹配"
      B_create_new: "创建新权限码"
        pros: "精确匹配业务语义"
