  DEC-014:
    title: "供应商 H5 外部认证如何实现"
    category: SECURITY
    question: "SupplierPortalController H5 端点如何实现外部供应商认证？"
    current_reality: |
      permission-data-scope-map.md §7.2: 6 个 H5 端点
      (/h5/contract, /h5/view, /h5/verify, /h5/sign, /h5/reject) 无认证。
      外部供应商无系统账号，H5 端点暴露在公网。
    why_decision_needed: |
      无认证的 H5 端点可被任意访问，存在数据泄露和未授权操作风险。
      需要设计适合外部用户的认证机制。
    options:
      A_token_link: "Token + 邀请链接"
        pros: "简单，无需注册"
        cons: "Token 安全性需保障"
      B_sms_verify: "短信验证码认证"
        pros: "二次验证，安全性高"
        cons: "用户体验稍差"
      C_wechat_auth: "微信授权登录"
        pros: "用户体验好，可获取微信身份"
        cons: "依赖微信生态"
      D_supplier_account: "供应商注册账号"
        pros: "完整账号体系"
        cons: "供应商使用门槛高"
    affected_domains: [Procurement, System]
    affected_objects: [suppliers, users, permissions]
    upstream_impact: "需设计外部认证流程和 Token 管理"
    downstream_impact: "前端需实现认证流程，后端需实现 Token 校验"
    recommendation: "A_token_link"
    decision_status: OPEN
    evidence:
      - "permission-data-scope-map.md §7.2: 6 H5 端点无认证"
      - "permission-data-scope-map.md §11: P0 级风险"
      - "conflict-registry.md PD-008: BLOCKED_PRODUCT_DECISION"

