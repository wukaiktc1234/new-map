# ============================================================================
# BUSINESS ITEM CANONICAL - CONFLICT BOUNDARY REVIEW 001
# Clash Classification Registry (A / B / C / D)
# ============================================================================
# 任务性质: 矛盾边界收口审查 (CLOSURE REVIEW)
# 生成日期: 2026-09-11
# 代码/schema/迁移改动: 无
# 本地文档路径: docs/architecture/
#
# 本文件不做: 不提出新架构 / 不设计表或 API / 不创建新 Option /
#             不把 Recommendation 写成 Decision
#
# 分类规则:
#   A - 必须由业务/架构负责人决策 (工程无法替代; 选错改变业务世界模型)
#   B - 已有充分事实, 可直接工程修复 (不依赖未决业务语义; 不改业务含义)
#   C - 必须先取得生产证据 (本地证据不足; 贸然决定会误判环境差异)
#   D - 当前判断本身可能错误 (不能进决策, 也不能进工程)
#
# 证据等级:
#   LIVE_LOCAL_INSTANCE_EVIDENCE - 本机 PostgreSQL 实例实测
#   CODE_EVIDENCE               - 代码 / DDL / 日志
#   HISTORICAL_EVIDENCE         - 既有文档
#   PRODUCTION_EVIDENCE         - 生产库查询 + 结果 (本次: 0 条, 生产不可达)
# ============================================================================

registry_version: "1.0"
registry_status: "CLOSURE_REVIEW"
review_task: "CONFLICT-BOUNDARY-CLOSURE-REVIEW-001"
review_date: "2026-09-11"
review_role: "INDEPENDENT_REVIEWER (NOT engineer, NOT architecture decision maker)"
local_docs_path: "docs/architecture"
code_or_schema_changes: 0
writes_performed: 0

governance_state_at_review:
  pd_canonical_001_status: "RECOMMENDED / NOT CONFIRMED"
  pd_canonical_001_modified: false
  production_evidence_gate_0: "BLOCKED"
  local_evidence_label: "LIVE_LOCAL_INSTANCE_EVIDENCE"
  promotion_of_local_to_production: false
  foods_locked_as: "Dish/Sales Food Truth"
  material_archives_locked_as: "Material Truth"
  orders_locked_as: "canonical order truth"

# ============================================================================
# SECTION A - OWNER DECISIONS REQUIRED
# ============================================================================
owner_decisions:

  - id: "A1"
    question: "Product Definition / Commercial Unit / Inventory Holding 是否分层; 若分层, 哪一层作为库存计量基准"
    classification: "A"
    why_not_engineering: >
      Commercial Unit 层在工程中完全不存在 (无 sku 列, 无 uom, 无换算列,
      无任何物料含多个包装层级)。是否需要该层取决于业务是否要求
      「同一物品多交易单位」, 属业务模型主张。
    why_not_production_evidence_only: "生产数据可降低不确定性, 但不能替代负责人的模型选择。"
    why_not_further_validation: "问题表述清楚, 不存在『问题本身错误』的情形。"
    current_facts:
      - evidence: "inventory.material_id 填充 11/11; product_id 填充 1/11"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "三张主数据表 (foods / material_archives / product) 之间无任何 FK 或映射表"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "全库无 sku / uom / conversion / pack_size 列 (仅命中 orders.packaging_fee)"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "本地无任何一个物料拥有多个包装层级"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
    linked_production_evidence: ["C1", "C4"]
    blocks: ["Identity Resolution Model", "PD-CANONICAL-001", "AD-IDENTITY-001", "AD-INVENTORY-002"]

  - id: "A2"
    question: "inventory.product_id 与 material_id 命名空间冲突的处置方向"
    classification: "A"
    why_not_engineering: >
      「谁是物品真相」是业务主张; 且实测两列所在唯一同时填充的行指向
      语义无关的不同物品, 说明可能是「二者本就不应出现在同一行」,
      而非简单的二选一。
    current_facts:
      - evidence: "inventory_id=4 -> material_id=1(娃娃菜) 与 product_id=1(测试物料A)"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "fk_inv_product_id 是全库唯一指向 product 的物理外键; material_id 无 FK"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "Inventory.java:382-388 将 getProductId() 实现为 materialId 的别名"
        grade: "CODE_EVIDENCE"
    linked_production_evidence: ["C1", "C6"]
    blocks: ["PD-CANONICAL-001", "DS-001", "DS-002", "AD-IDENTITY-001"]

  - id: "A3"
    question: "仓库持仓 (inventory) 与门店持仓 (store_inventory) 是同一持仓的两个视图, 还是两个独立持仓"
    classification: "A"
    why_not_engineering: "决定两处数量差异是缺陷还是业务常态; 决定对账规则。"
    current_facts:
      - evidence: "store_only=7, warehouse_only=2, both=7, both_divergent=4"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "差异实例: 娃娃菜 101 vs 71; 虾滑 40 vs 70; 汤桶 0 vs 2; 洗剂 0 vs 20"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "两表精度不同: integer vs numeric(15,3)"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "同一动作多处 dual-write 两张表; InventorySummaryMapper 以 UNION ALL 相加"
        grade: "CODE_EVIDENCE"
    linked_production_evidence: ["C2"]
    blocks: ["AD-INVENTORY-002", "AD-LOCATION-001", "DS-017"]

  - id: "A4"
    question: "批次 / 效期是否构成持仓身份维度"
    classification: "A"
    why_not_engineering: "涉及食品安全召回责任归属与库存粒度, 属业务/合规主张。"
    current_facts:
      - evidence: "inventory.batch_no 填充 4/11, expiry_date 0/11, production_date 0/11"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "store_inventory 无任何 batch / expiry / production 列"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "material_trace_code 18 行 (batch 13, expiry 8) 持有另一套批次事实"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "inventory_transactions 无批次列"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "效期预警逻辑读取实测填充率为 0 的列"
        grade: "CODE_EVIDENCE"
    linked_production_evidence: ["C3"]
    blocks: ["DS-016", "AD-INVENTORY-002"]

  - id: "A5"
    question: "orders_legacy / 旧 POS 链路在业务上是否仍在服役"
    classification: "A"
    why_not_engineering: "是否仍有旧 POS 端写入该表属部署与业务事实, 工程无法从本地判定。"
    current_facts:
      - evidence: "OrderMapper.java 含 18 处 orders_legacy 引用, 11 个 legacy 统计方法均无调用方"
        grade: "CODE_EVIDENCE"
      - evidence: "本地 orders_legacy = 0 行; order_items_legacy = 0 行"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "OrderServiceImpl 仍使用 Order 实体 (@TableName(\"orders_legacy\"))"
        grade: "CODE_EVIDENCE"
      - evidence: "在用的日结聚合 (aggregateByPaymentMethod 等) 全部查 orders 表"
        grade: "CODE_EVIDENCE"
    linked_production_evidence: ["C7"]
    blocks: ["order truth 收敛"]

  - id: "A6"
    question: "dish_recipe (单数) 与 dish_recipes (复数) 的业务归属, 以及 dish_id <-> food_id 的对应关系"
    classification: "A"
    why_not_engineering: "两表键空间不同 (VARCHAR(50) vs BIGINT) 且无任何映射表; 对应关系属业务事实。"
    current_facts:
      - evidence: "dish_recipe = 0 行; dish_recipes 活跃 1 行 + 软删 4 行"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "DishRecipe 实体映射 21 列, dish_recipe 实际仅 13 列; 缺 ingredient_id / sort_order / estimated_cost 等"
        grade: "CODE_EVIDENCE"
      - evidence: "DishRecipeMapper 4 条查询必然失败; 被 3 个服务注入"
        grade: "CODE_EVIDENCE"
      - evidence: "FoodServiceImpl / OrderNewServiceImpl / RecipeServiceImpl / StockForecastServiceImpl 均使用 dish_recipes"
        grade: "CODE_EVIDENCE"
    linked_production_evidence: []
    linked_engineering: ["B3"]
    blocks: ["DS-010", "配方真相"]

  - id: "A7"
    question: "foods.stock 是否计入『库存』范畴 (限量标记 vs 库存管理)"
    classification: "A"
    why_not_engineering: "成品库存是否进入库存口径属业务定义问题。"
    current_facts:
      - evidence: "foods.stock 有值 (本地 99) 且存在专门的库存回补代码路径"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "foods 列注释为『库存数量（可选，用于限量菜品）』"
        grade: "CODE_EVIDENCE"
      - evidence: "无任何台账记录 foods.stock 变动"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
    linked_production_evidence: []
    blocks: ["库存真相范围"]

# ============================================================================
# SECTION B - ENGINEERING ACTIONS ALLOWED
# ============================================================================
engineering_actions:

  - id: "B1"
    defect: "precision mismatch: inventory.current_stock 与 store_inventory.current_stock 精度不一致"
    current_facts:
      - evidence: "inventory.current_stock = integer(32,0); safety_stock = integer"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "store_inventory.current_stock = numeric(15,3)"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "chk_inventory_stock_nonneg 亦为整数比较"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
    allowed_action: "将 inventory.current_stock / safety_stock 精度对齐至与门店一致; 不改变任何数值"
    forbidden: ["改名", "改业务含义", "删除数据"]
    depends_on_decision: null
    blocks_decision: false

  - id: "B2"
    defect: "missing FK: inventory.material_id / store_inventory.material_id 无外键"
    current_facts:
