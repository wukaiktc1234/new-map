        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
    allowed_action: "在无孤儿的前提下补充 FK"
    forbidden: ["在有孤儿时强行加约束", "清洗孤儿数据"]
    depends_on_decision: null
    precondition: "先执行 B4 同类孤儿检查"
    blocks_decision: false

  - id: "B3"
    defect: "dish_recipe 代码查询不存在的列 (必然失败)"
