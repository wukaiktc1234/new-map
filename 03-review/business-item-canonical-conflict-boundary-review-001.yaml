    evidence_needed: "生产两列填充率与不一致行数; 生产 product 行数与引用数"

  - id: "F-A3"
    target: "A3 两余额表关系"
    if_adopt_X_breaks:
      - "现有 4 例数量差异须判为数据错误并修正, 会改变账面库存"
