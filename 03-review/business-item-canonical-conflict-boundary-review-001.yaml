      - evidence: "端点 POST /v1/inventory-deduction/recipe 存在; 前端调用方 0"
        grade: "CODE_EVIDENCE"
    allowed_action: "移除或停用该必然失败的代码路径, 或明确标注为不可用"
    forbidden: ["表间语义迁移 (属 A6)", "改变配方业务含义"]
    depends_on_decision: "A6 (仅限制迁移; 停用旁证缺陷不需要)"
    blocks_decision: false

  - id: "B4"
    defect: "dangling inventory_transactions.inventory_id"
    current_facts:
      - evidence: "17/27 (62.96%) inventory_id 指向不存在的持仓行"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "悬挂 id 集合: 9,12,15,16,24,26,28"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "3 行持仓无任何流水: inventory_id 5,30,34"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
    allowed_action: "登记悬挂清单并暴露; 加 FK 前先处理孤儿"
    forbidden: ["删除历史流水", "改写流水指向"]
    depends_on_decision: null
    blocks_decision: false

  - id: "B5"
    defect: "inventory_transactions.transaction_type 为 NULL"
