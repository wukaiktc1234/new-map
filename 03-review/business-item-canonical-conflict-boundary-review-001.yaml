        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
    allowed_action: "补枚举值, 或显式声明允许 NULL 并加注释"
    forbidden: ["猜测业务含义"]
    depends_on_decision: null
    blocks_decision: false

  - id: "B6"
    defect: "store_inventory_log.store_id 含孤儿值"
    current_facts:
      - evidence: "值 584 不匹配 stores(1,2), 也不匹配 warehouses(1..10)"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "store_inventory_log 无任何外键"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
    allowed_action: "增加来源/类型校验并登记孤儿值"
    forbidden: ["改写历史值"]
    depends_on_decision: null
    blocks_decision: false

  - id: "B7"
    defect: "product 残留调用点映射可疑"
    current_facts:
      - evidence: "ProductMapper 5 处调用; PurchaseOrderServiceImpl.java:638 以 dto.getMaterialId() 查 product"
        grade: "CODE_EVIDENCE"
      - evidence: "product 表仅 1 行测试数据 (测试物料A)"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
    allowed_action: "增加断言/日志以暴露映射不匹配"
    forbidden: ["删除调用点 (退役属 A1/A5 决策)"]
    depends_on_decision: "A1/A2 (仅限制删除)"
    blocks_decision: false

  - id: "B8"
    defect: "purchase_request_item.food_id 无输入校验, 解析失败静默写 0L"
    current_facts:
      - evidence: "46/50 (92%) 实为 material ID"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "3 行不可解析, 1 行无匹配"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "服务层 Long.parseLong 失败时静默写入 0L"
        grade: "CODE_EVIDENCE"
    allowed_action: "增加输入校验, 消除静默降级, 改为显式失败"
    forbidden: ["改列名", "改业务语义 (属 A2)"]
    depends_on_decision: null
    blocks_decision: false

  - id: "B9"
    defect: "inventory_unit / inventory_category 端点必然失败"
    current_facts:
      - evidence: "to_regclass 对两表均返回 NULL"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "实体 + Mapper + Service + Controller 全套存在, 各 6 个端点"
        grade: "CODE_EVIDENCE"
      - evidence: "前端调用方 0"
        grade: "CODE_EVIDENCE"
      - evidence: "2026-06-30 日志显示曾被 Web 端调用且返回成功 (96 条)"
        grade: "CODE_EVIDENCE"
    allowed_action: "使端点不再暴露 (下线或遮蔽)"
    forbidden: ["建表 (属业务语义, 见 C5)"]
    depends_on_decision: "C5 (仅限制建表)"
    blocks_decision: false

  - id: "B10"
    defect: "inventory 缺业务唯一约束"
    current_facts:
      - evidence: "仅 inventory_pkey(inventory_id); 无 (material_id, warehouse_id) 唯一键"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "实测当前 0 重复组"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
      - evidence: "对照 store_inventory 有 uk_store_inventory_store_material"
        grade: "LIVE_LOCAL_INSTANCE_EVIDENCE"
    allowed_action: "增加仅防重复的唯一约束 (不建跨表同步)"
    forbidden: ["建立两余额表同步机制 (属 A3)"]
    depends_on_decision: "A3 (仅限制同步机制)"
    blocks_decision: false

