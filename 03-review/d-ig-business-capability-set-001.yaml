capability_set_metadata:
  decision_id: D-IG
  execution_owner: ENGINEERING_TEAM
  completeness_reviewer: BUSINESS_OWNER
  adversarial_reviewer: DEEPSEEK
  status: OPEN
  establishment_status: INITIAL_V1_ESTABLISHED_PENDING_OWNER_REVIEW
  establishment_date: 2026-09-12
  source_boundary:
    implemented: CURRENT_EVIDENCE_PACKAGE_BEHAVIOR_PATHS
    declared: BUSINESS_OWNER_RECORDED_SOURCES_ONLY
    unknown: UNCONFIRMED_BOUNDARIES_RELEVANT_TO_PRE_SCREEN
  requirement_driven_status: REQUIREMENT_DRIVEN_INCOMPLETE
  production_evidence_status: BLOCKED
  production_dependent_conclusions: PROVISIONAL_PENDING_PRODUCTION_EVIDENCE
  completeness_review_status: PENDING
  pre_screen_authorization: BLOCKED
  owner_review_status: PENDING
  declared_capability_count: 0
  implemented_capability_count: 32
  unknown_boundary_count: 8
  methodology_status: FROZEN
  schema_authorization: NO
  migration_authorization: NO
  identity_decision: NOT_MADE
  h1_h2_decision: NOT_MADE
  extraction_note: >-
    Capability names are business behaviors extracted from documented behavior
    paths. Table names, endpoint names, Service names, permissions, or frontend
    modules are supporting evidence only and are not treated as capabilities by
    themselves.

  owner_source_inventory:
    business_owner_interview: NOT_OBTAINED_IN_REPOSITORY
    store_operating_rules: NOT_OBTAINED_IN_REPOSITORY
    pricing_rules: NOT_OBTAINED_IN_REPOSITORY
    compliance_traceability_requirements: NOT_OBTAINED_IN_REPOSITORY
    approved_future_planning: NOT_OBTAINED_IN_REPOSITORY

  deduplication_execution:
    method: CHARTER_STEP_3_FIVE_POINT_BOUNDARY_CHECK
    checks:
      - business_action
      - trigger_condition
      - business_result
      - responsibility
      - lifecycle
    result: >-
      Capabilities are separated by distinct business actions/results; no
      cross-domain capability was merged solely because it used the same table,
      API, Service, or noun. Distinct lifecycle or responsibility paths remain
      separate.

