## Conflict E: Inventory Truth

| 字段 | 值 |
|------|-----|
| **Conflict ID** | CONFLICT-E |
| **标题** | Stock Ledger / Inventory Instance / Balance 的关系 |
| **严重程度** | HIGH |
| **状态** | RECONCILED |

### 五种概念的关系

```
Stock Ledger (Movement entries)
    ↓ 聚合
Inventory Instance (Current Fact at Location)
    ↓ 查询
Balance (Derived View)
    ↓ 报表
Snapshot (Point-in-time)
    ↓ 汇总
Aggregation (Total across Locations)
```

### 统一结论

| 概念 | 定义 | 是否 Truth | 说明 |
|------|------|------------|------|
| Stock Ledger | 不可变的库存变动记录 | **YES** | 唯一 Truth Source |
| Inventory Instance | Item × Location 的当前状态 | **Derived** | 可从 Ledger 重建 |
| Balance | 可用数量 | **Derived** | Instance 的子集 |
| Snapshot | 某时刻的库存快照 | **Derived** | 用于报表 |
| Aggregation | 跨 Location 汇总 | **Derived** | 用于总览 |

### Decision Gap

无需 Product Decision，语义已收敛。

