## Conflict D: Role vs Capability

| 字段 | 值 |
|------|-----|
| **Conflict ID** | CONFLICT-D |
| **标题** | SELLABLE/PURCHASABLE/STOCKABLE/CONSUMABLE/INGREDIENT 的分类 |
| **严重程度** | HIGH |
| **状态** | PARTIAL RESOLVED |

### 五个概念的分类

| 概念 | 06 结论 | 07 结论 | 统一结论 | 状态 |
|------|---------|---------|----------|------|
| SELLABLE | Capability + Role | - | Capability（全局）+ Role（场景） | RECONCILED |
| PURCHASABLE | Capability + Profile | - | Capability（全局）+ Profile（采购配置） | RECONCILED |
| STOCKABLE | Role（Location-scoped） | Role（Location-scoped） | Role（Location-scoped） | RECONCILED |
| CONSUMABLE | Role | - | Role（Recipe 场景） | RECONCILED |
| INGREDIENT | Relationship | - | Recipe ↔ Item Relationship | RECONCILED |

### INGREDIENT 的特殊分析

- **06 结论**：Ingredient 是 Material 在 Recipe 场景中的 Role
- **07 结论**：Ingredient 是 RecipeComponent 的业务名称
- **统一结论**：Ingredient **不是** Item 自身的 Role，而是 Recipe ↔ Item 之间的 Relationship 参与方身份
- **证据**：同一个 Item（鸡翅）可以参与多个 Recipe（可乐鸡翅、香辣鸡翅），Ingredient 身份随 Recipe 变化

### Decision Gap

无需 Product Decision，语义已收敛。

