## Conflict B: Model C 命名一致性

| 字段 | 值 |
|------|-----|
| **Conflict ID** | CONFLICT-B |
| **标题** | Model C 在 06 和 07 中的含义不同 |
| **严重程度** | MEDIUM |
| **状态** | RESOLVED |

### 两种表述

**06-business-item-model**：
- Model C = Hybrid Domain Model
- 核心：Canonical Identity + Commercial Definition + Operational Definition + Roles

**07-inventory-semantic-model**：
- Model C-Hybrid = Canonical Item + Unified Location + Ledger-First
- 核心：Canonical Item × Location × Inventory Instance

### 分析

两个 Model C **不是同一个模型**：
- 06 的 Model C 是 Business Item 的全域模型
- 07 的 Model C-Hybrid 是 Inventory 域的专用模型
- 编号相同是因为 07 继承了 06 的编号方案，但语义已分化

### 解决方案

- **已收敛的概念**：Canonical Identity、Role-based、Location-scoped
- **未收敛的概念**：Inventory Instance vs Inventory Fact、Ledger-First vs Balance-First
- **建议**：取消模型编号继承，改用统一 Candidate ID（如 CAND-BI-001, CAND-INV-001）

### Decision Gap

无需 Product Decision，但需要在整合文档中统一命名。

