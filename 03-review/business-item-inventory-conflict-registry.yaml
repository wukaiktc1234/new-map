## Conflict A: Product 语义冲突

| 字段 | 值 |
|------|-----|
| **Conflict ID** | CONFLICT-A |
| **标题** | Product 的语义：废弃概念 vs Base Type |
| **严重程度** | HIGH |
| **状态** | OPEN |

### 两种表述

**表述 A** — Product 是已废弃的 Legacy Concept：
- 来源：`06-business-item-model/product-semantic-analysis.md`
- Evidence：`product` 表标记为 LEGACY，Java Entity 无活跃引用
- 结论：Product 应被废弃，由 Material 替代

**表述 B** — Product 是 Base Type：
- 来源：`06-business-item-model/concept-taxonomy.md`
- Evidence：Product 作为业务化的物品表达（可交易和管理的物品）
- 结论：Food/Material 是 Product 的 Subtype

### Evidence 分析

| 维度 | 表述 A | 表述 B |
|------|--------|--------|
| 数据库证据 | product 表存在但无活跃 Service 引用 | product 表有残留数据 |
| 代码证据 | MaterialService 替代 ProductService | 无活跃代码路径使用 Product |
| 业务语义 | 废弃概念，不再需要 | 商业定义层，支撑集团化 |

### 判断

- **Current Reality**：Product 表存在但无活跃业务角色 → 表述 A 更接近现实
- **Recommendation**：Product 作为 Commercial Definition 可能有长期价值，但当前无业务必要性
- **是否需要 Decision**：**是** — DEC-006 已覆盖此问题，状态 OPEN

### Decision Gap

需要 Product Owner 决定：Product 是否作为 Commercial Definition 保留，还是彻底废弃。

