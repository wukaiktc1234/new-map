## Conflict C: Material vs Canonical Item

| 字段 | 值 |
|------|-----|
| **Conflict ID** | CONFLICT-C |
| **标题** | Material 是 Canonical Identity 还是 Legacy Implementation Object |
| **严重程度** | HIGH |
| **状态** | OPEN |

### 两种表述

**表述 A** — Material 是 Canonical Identity：
- 来源：`07-inventory-semantic-model/inventory-truth-analysis.md`
- Evidence：inventory.material_id 贯穿采购→库存→配方全生命周期
- 结论：Material 是跨域统一身份

**表述 B** — Material 是 Legacy Implementation Object：
- 来源：`06-business-item-model/candidate-semantic-models.md`
- Evidence：Material 是当前数据库表名，不应等同于目标业务模型
- 结论：需要 Canonical Item 作为更高层抽象

### Evidence 分析

| 维度 | 表述 A | 表述 B |
|------|--------|--------|
| 当前事实 | material_id 贯穿全系统 | material_archives 是数据库表名 |
| 目标模型 | Material 作为 Canonical Identity | Canonical Item 作为统一抽象 |
| 迁移成本 | 低（保持现有） | 高（需要新建 Canonical Item） |

### 判断

- **Current Reality**：Material 是事实上的 Canonical Identity（LOCK-A002 已锁定）
- **Recommendation**：Material 作为当前 Canonical Identity，但目标模型应引入 Canonical Item 作为更高层抽象
- **关键区分**：Material 是 Type（"原料"），不是 Identity（"这瓶可口可乐330ml"）
- **是否需要 Decision**：**是** — 需要 DEC-006-REFINED 覆盖

### Decision Gap

需要 Product Owner 决定：Material 是否作为 Canonical Identity 保留，还是引入 Canonical Item 替代。

