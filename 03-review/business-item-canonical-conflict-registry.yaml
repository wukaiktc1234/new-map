    title: "Product 语义：废弃概念 vs Umbrella Concept"
    severity: "HIGH"
    status: "OPEN"
    source_files:
      - "06-business-item-model/product-semantic-analysis.md"
      - "06-business-item-model/dec-006-refined-decision-pack.md"
    description_a: "Product 是已废弃的 Legacy Concept"
    evidence_a: "product 表标记为 LEGACY，无活跃 Service 引用"
    description_b: "Product 是 Umbrella / Commercial Concept"
    evidence_b: "Product 作为业务化的物品表达，支撑集团化"
    judgment: "Legacy product table ≠ Product business concept"
    decision_boundary: "PD-CANONICAL-002"

  - conflict_id: "CONFLICT-B"
    title: "Material 是 Canonical Identity 还是 Implementation Object"
    severity: "HIGH"
    status: "OPEN"
    source_files:
      - "06-business-item-model/material-analysis.md"
      - "06-business-item-model/dec-006-refined-decision-pack.md"
    description_a: "Material 是 Canonical Identity，代表物品的唯一标识"
    evidence_a: "material 表作为主表，所有 Service 依赖其 ID"
    description_b: "Material 是 Implementation Object，仅存储物理属性"
    evidence_b: "Material 缺少业务语义，仅包含技术实现细节"
    judgment: "Material 混合了身份标识与物理属性"
    decision_boundary: "PD-CANONICAL-004"

  - conflict_id: "CONFLICT-C"
    title: "Food 是 Entity / Type / Commercial Profile"
    severity: "HIGH"
    status: "OPEN"
    source_files:
      - "06-business-item-model/food-analysis.md"
      - "06-business-item-model/dec-006-refined-decision-pack.md"
    description_a: "Food 是独立 Entity，代表可食用物品"
    evidence_a: "food 表有独立字段如 shelf_life"
    description_b: "Food 是 Type 属性，标记物品是否可食用"
    evidence_b: "Food 通过 is_food 标记，而非独立实体"
    judgment: "Food 语义不明确，既像实体又像属性"
    decision_boundary: "PD-CANONICAL-003"

  - conflict_id: "CONFLICT-D"
    title: "INGREDIENT 是 Item Role 还是 Recipe Relationship"
    severity: "MEDIUM"
    status: "RECONCILED"
    source_files:
      - "06-business-item-model/ingredient-analysis.md"
    description_a: "INGREDIENT 是 Item Role，代表物品在配方中的角色"
    evidence_a: "ingredient 表包含 role 字段"
    description_b: "INGREDIENT 是 Recipe Relationship，代表配方关系"
    evidence_b: "ingredient 表连接 material 和 recipe 表"
    judgment: "已明确为 Recipe Relationship，通过外键定义关系"
    decision_boundary: null
    note: "RECONCILED SEMANTIC INVARIANT, NOT_BLOCKING"

  - conflict_id: "CONFLICT-E"
    title: "CONSUMABLE 的三种消费场景"
    severity: "MEDIUM"
    status: "OPEN"
    source_files:
      - "06-business-item-model/consumable-analysis.md"
    description_a: "CONSUMABLE 指原料消耗，用于生产过程"
    evidence_a: "生产过程中原料被消耗，减少库存"
    description_b: "CONSUMABLE 指销售/服务消耗，用于交付"
    evidence_b: "销售或服务时物品被消耗，减少库存"
    judgment: "三种场景（生产、销售、服务）混用同一概念，需明确区分"
    decision_boundary: "PD-CANONICAL-006"

  - conflict_id: "CONFLICT-F"
    title: "Inventory Truth: Ledger vs Balance"
    severity: "HIGH"
    status: "OPEN"
    source_files:
      - "06-business-item-model/inventory-analysis.md"
    description_a: "Inventory Truth 基于 Ledger（流水账）"
    evidence_a: "inventory_ledger 表记录每笔变动"
    description_b: "Inventory Truth 基于 Balance（余额）"
    evidence_b: "inventory_balance 表记录当前库存"
    judgment: "Ledger 与 Balance 数据不一致，需统一真相源"
    decision_boundary: "AD-INVENTORY-001"

  - conflict_id: "CONFLICT-G"
    title: "Location: Transit 是 Virtual Location 还是 Movement Context"
    severity: "MEDIUM"
    status: "OPEN"
    source_files:
      - "06-business-item-model/location-analysis.md"
    description_a: "Transit 是 Virtual Location，代表在途位置"
    evidence_a: "location 表包含 transit 类型"
    description_b: "Transit 是 Movement Context，代表移动上下文"
    evidence_b: "Transit 记录移动过程而非固定位置"
    judgment: "Transit 语义不明确，混合位置与过程"
    decision_boundary: "AD-LOCATION-001"

  - conflict_id: "CONFLICT-H"
    title: "UOM: 为什么需要多个 UOM？"
    severity: "MEDIUM"
    status: "OPEN"
    source_files:
      - "06-business-item-model/uom-analysis.md"
    description_a: "多个 UOM 支持不同业务场景"
    evidence_a: "采购用箱，生产用公斤，销售用个"
    description_b: "多个 UOM 导致转换复杂"
    evidence_b: "需要维护 UOM 转换表"
    judgment: "多 UOM 必要但需简化转换逻辑"
    decision_boundary: "AD-UOM-001"

