  - conflict_id: "BIC-001"
    severity: "CRITICAL"
    title: "同一持仓行持有两个命名空间的外键，且指向语义无关的不同物品"
    type: "IDENTITY_COLLISION"
    evidence_grade: "E1_DB_LIVE"
    side_a:
      claim: "inventory.product_id 与 inventory.material_id 是同一物品的两种表示（'product_id 的值与 material_id 的值恰好一致'）"
      sources:
        - "06-business-item-model/canonical-identity-analysis.md:444-448"
        - "03-review/system-fact-map-v1.md:55"
    side_b:
      claim: "两列指向语义无关的不同物品"
      observed:
        - "inventory_id=4: material_id=1 -> material_archives#1 = 娃娃菜"
        - "inventory_id=4: product_id=1  -> product#1           = 测试物料A"
      reproduction: "SELECT i.inventory_id,i.material_id,ma.material_name,i.product_id,p.name FROM inventory i LEFT JOIN material_archives ma ON ma.material_id=i.material_id LEFT JOIN product p ON p.product_id=i.product_id WHERE i.inventory_id=4;"
      constraints:
        - "fk_inv_product_id: FOREIGN KEY (product_id) REFERENCES product(product_id)  [存在]"
        - "inventory.material_id -> material_archives.material_id  [无任何外键]"
    why_critical: >
      任何以「存在一个统一 Canonical Identity」为前提的模型（Option B 及 Option D 的 L1）
      都必须能解释这一行。实测显示这不是「同一物品的两种表示」，而是两个不同物品被压进
      同一行。该冲突未被 PD-CANONICAL-001 的任何 Scope Item 覆盖。
    blocks: ["DS-001", "DS-002", "DS-004", "DS-005", "DS-015"]
    resolution_owner: "Product Owner"
    status: "UNRESOLVED"

