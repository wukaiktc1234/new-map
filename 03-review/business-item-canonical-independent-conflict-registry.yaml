  # ==========================================================================
  - conflict_id: "BIC-005"
    severity: "BLOCKER"
    title: "真实数据对 Specification = IDENTITY_BOUNDARY 构成直接反例"
    type: "COUNTEREXAMPLE_FROM_REAL_DATA"
    evidence_grade: "E1_DB_LIVE"
    real_rows:
      - "material_id=17 圆形打包盒   unit=套 spec=500ml reference_price=45"
      - "material_id=18 长方形打包盒 unit=套 spec=750ml reference_price=55"
    side_a:
      claim: "Specification（Size/Volume/Weight）是 Identity 的物理边界；任一不同即不同 Identity"
      sources: ["PD-CANONICAL-001-Decision.yaml:252-258, 159"]
    side_b:
      claim: "Packaging / Container Type 是 NOT_IDENTITY_BOUNDARY"
      sources: ["PD-CANONICAL-001-Decision.yaml:267-273"]
    observed_problem: >
      两个打包盒的差异同时包含「形状」与「容量」，而系统把二者压进同一个 spec 文本列。
      若形状是身份边界 -> 同一物品的容量升级会变身份（与 DS-011 冲突）；
      若形状不是边界 -> 单列 spec 无法表达该区分（与 DS-005 冲突）。
      两条路都说明：单列 spec 不足以承担身份判定。
    resolution_owner: "Product Owner"
    status: "UNRESOLVED"

