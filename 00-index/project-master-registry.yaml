# ──────────────────────────────────────────────────────────────────────────────
# 跨域协调矩阵 (MAP-002)
# ──────────────────────────────────────────────────────────────────────────────
cross_domain_coordination:
  management_core:
    name: Management Core
    role: OWNER
    owns: [food, material, inventory, purchase, finance, employee, store]
    reads: [order, member]
    writes: [all]
    event_consumers: [order_completed, purchase_stockin, salary_paid]

  pos:
    name: POS
    role: CONSUMER
    owns: [orders_legacy]
    reads: [food, store_inventory, member]
    writes: [orders_legacy, order_items_legacy]
    event_consumers: [order_created]

  kitchen:
    name: Kitchen
    role: CONSUMER
    owns: []
    reads: [order, food]
    writes: [kitchen_order_status]
    event_consumers: [order_created]

  employee:
    name: Employee
    role: CONSUMER
    owns: []
    reads: [schedule, attendance, salary, knowledge]
    writes: [attendance, leave_request, approval]
    event_consumers: [schedule_published]

  miniprogram:
    name: Mini Program
    role: CONSUMER
    owns: []
    reads: [food, order, member, coupon]
    writes: [order, member]
    event_consumers: [order_created]

  receiving_mobile:
    name: Receiving Mobile
    role: CONSUMER
    owns: []
    reads: [purchase_order, material, supplier]
    writes: [receipt_confirmation, quality_check]
    event_consumers: [purchase_order_created]

  inventory:
    name: Inventory
    role: DOMAIN
    owns: [inventory, store_inventory, inventory_transactions]
    reads: [material, warehouse, store]
    writes: [inventory_adjust, inventory_transfer]
    event_consumers: [purchase_stockin, order_completed]

  finance:
    name: Finance
    role: DOMAIN
    owns: [voucher, payable, receivable, accounting_subject, fund_flow]
    reads: [order, purchase, payment, receipt]
    writes: [voucher, finance_record, fund_flow]
    event_consumers: [order_completed, purchase_stockin, salary_paid, store_daily_settlement]
