      - "插入默认中央仓库数据"
      - "更新 inventory.warehouse_id 引用"
    duration: "2-3 天"
  phase_2:
    name: "更新服务层"
    tasks:
      - "创建 WarehouseService (CRUD)"
      - "创建 WarehouseRepository"
      - "更新 InventoryService 支持仓库查询"
      - "更新 PurchaseStockinService 指定仓库"
    duration: "3-5 天"
  phase_3:
    name: "前端适配"
    tasks:
      - "仓库管理页面 (WarehouseList.vue, WarehouseForm.vue)"
      - "采购入库选择仓库"
      - "库存查询按仓库筛选"
    duration: "3-5 天"
  total_effort: "8-13 人天"

# ============================================================================
