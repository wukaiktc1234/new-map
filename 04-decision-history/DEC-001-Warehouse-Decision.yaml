# ============================================================================
acceptance_criteria:
  - "warehouses 表存在且有默认数据"
  - "inventory.warehouse_id 可关联 warehouses.id"
  - "采购入库可指定仓库"
  - "库存查询可按仓库筛选"
  - "库存统计可按仓库聚合"
  - "仓库间调拨有明确的仓库标识"

