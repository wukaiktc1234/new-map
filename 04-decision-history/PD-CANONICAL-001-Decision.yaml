 # ============================================================================
 # 一、Decision Question (Corrected)
 # ============================================================================
 question: |
   Canonical Business Identity 的正式业务语义是什么？
   
   具体包括：
   1. Identity 是否存在？
   2. Identity 的业务定义
   3. Identity 稳定性原则
   4. Same Identity 判断规则
   5. Different Identity 判断规则
   6. Identity 与 Context / Capability / Role / Profile / Relationship 的关系
   7. Identity 与 Packaging / UOM / SKU / Barcode / Supplier / Batch / Store 的关系
   8. Identity 生命周期语义

 # ============================================================================
 # 二、当前现实
 # ============================================================================
 current_reality:
   truth_source: "各模块自行维护 Identity，无统一 Canonical Identity"
   evidence:
     - location: "06-business-item-model/canonical-identity-analysis.md"
       finding: "可乐在系统中有 4 个独立表示：foods(product_code='COLA001'), product(product_code='COLA001'), material_archives(material_code='MAT_COLA001'), inventory(material_id=1)"
     - location: "03-review/business-item-canonical-semantic-reassessment.md §3.1"
       finding: "POS 用 product table, Procurement 用 material table, Inventory 用 stock_item/inventory_item, Recipe 用 ingredient table，Identity 来源不统一"
     - location: "03-review/current-business-semantic-baseline.md"
       finding: "inventory 以 material_id 管理库存；store_inventory 以 store_id + material_id 管理门店库存；dish_recipe 连接 food 和 material；order_items 使用 food_id；purchase_order_items 使用 material_id"
   confidence: HIGH
   problem_indicators:
     - "同一物理实体在不同模块有不同 ID 和 Name，跨模块统计需复杂多表 JOIN + 人工匹配"
     - "新增模块（如 loyalty program）无法直接引用同一个业务对象"
     - "同一可乐可能被建为两个 material，导致库存分散"

 # ============================================================================
 # 三、3 Business Invariants (不变量)
 # ============================================================================
 business_invariants:
   invariant_1:
     name: "多角色共存 (Multi-Capability Coexistence)"
     definition: "同一个业务对象可以同时承担：Sellable + Purchasable + Stockable + Consumable + Recipe Component。Canonical Identity 必须独立于任何单一 Capability。"
     evidence: "Coca-Cola 330ml: POS 销售 ✅ + 采购 ✅ + 库存 ✅ + 配方成分 ✅"
   invariant_2:
     name: "Identity 稳定性 (Identity Stability)"
     definition: "Business Identity 不因使用场景（POS / Procurement / Inventory / Recipe / Reporting）变化而变化。同一物理实体在所有 Context 中必须可识别为同一个 Canonical Identity。"
     evidence: "Coca-Cola 在 POS 是 food_id=101, 在 Procurement 是 material_id=205 — 当前实现违反 Invariant 2"
   invariant_3:
     name: "概念分离 (Concept Separation)"
     definition: "Identity / Role / Capability / Profile / Context 不得互相混淆。每个概念必须有独立的 ontology ownership。"
     evidence: "当前 material 表混合了 Identity + Procurement Profile + Inventory Profile — 违反 Invariant 3"

 # ============================================================================
 # 四、选项分析
 # ============================================================================
 options:
   A_type_specific:
     name: "Type-specific Entity (每个类型独立 Identity)"
     description: "Food / Material / Ingredient 各自定义 Identity，无统一 Canonical 层"
     invariant_validation:
       invariant_1: FAIL
       invariant_2: FAIL
       invariant_3: FAIL
     verdict: "根本问题未解决"

   B_unified_canonical:
     name: "Unified Canonical Business Identity (统一业务语义层)"
     description: "引入统一 Canonical Business Identity 作为业务语义层，独立于任何实现形式"
     invariant_validation:
       invariant_1: PASS
       invariant_2: PASS
       invariant_3: PASS
     verdict: "满足所有 Business Invariant"

   C_hybrid:
     name: "Hybrid (混合模式)"
     description: "部分类型共享 Canonical Identity，部分类型保持独立"
     invariant_validation:
       invariant_1: PARTIAL
       invariant_2: PARTIAL
       invariant_3: FAIL
     verdict: "Decision Boundary 模糊，无法满足 Invariant 3"

 # ============================================================================
 # 五、Recommendation
 # ============================================================================
 recommendation:
   primary: B_unified_canonical
   rationale: |
     1. **满足 3 个 Business Invariant**: 只有 Option B 能同时满足多角色共存、Identity 稳定性、概念分离
     2. **10 个业务案例全部验证通过**: 每个案例都指向 Canonical Identity 的必要性
     3. **当前现实已证明不足**: 各模块自行维护 Identity 导致跨模块统计复杂、数据冗余
     4. **与 L2-001~L2-010 收敛结论一致**: Capability / Profile / Context 已被识别为独立概念
   confidence: HIGH
   status: "RECOMMENDED (NOT CONFIRMED — 等待 Product Owner 正式确认)"
   recommendation_type: "Canonical Business Identity 作为业务语义层 (NOT 作为 table / UUID / implementation)"

 # ============================================================================
 # 六、Decision Scope (18 items — SEMANTICS ONLY)
 # ============================================================================
 decision_scope:
   category: "PRODUCT_SEMANTICS"
   description: "PD-CANONICAL-001 只决定业务语义，不决定实现形式"
   
   resolved_by_pd_001:
     - scope_id: "DS-001"
       item: "Canonical Business Identity 是否存在"
       status: "RESOLVED"
       conclusion: "存在。Option B — 统一 Canonical Business Identity 作为业务语义层"
     
     - scope_id: "DS-002"
       item: "Identity 的业务定义"
       status: "RESOLVED"
       conclusion: "Canonical Business Identity 是一个业务物品的内在标识，独立于任何使用场景（POS / Procurement / Inventory / Recipe / Reporting）"
     
     - scope_id: "DS-003"
       item: "Identity 稳定性原则"
       status: "RESOLVED"
       conclusion: "Business Identity 不因使用场景变化而变化。同一物理实体在所有 Context 中必须可识别为同一个 Canonical Identity"
     
     - scope_id: "DS-004"
       item: "Same Identity 判断规则"
       status: "RESOLVED"
       conclusion: "如果两个表示指向同一物理实体且在业务上不可区分（Brand + Product Family + Specification 相同），则为 Same Identity。详见 Identity Resolution Matrix"
     
     - scope_id: "DS-005"
       item: "Different Identity 判断规则"
       status: "RESOLVED"
       conclusion: "如果 Brand、Product Family、Specification 中任一不同，则为 Different Identity。详见 Identity Resolution Matrix"
     
     - scope_id: "DS-006"
       item: "Identity 与 Context 的关系"
       status: "RESOLVED"
       conclusion: "Identity 独立于 Context。Context（POS / Procurement / Inventory / Recipe）是使用场景，不是 Identity 的一部分"
     
     - scope_id: "DS-007"
       item: "Identity 与 Capability 的关系"
       status: "RESOLVED"
       conclusion: "Identity 独立于 Capability。Capability（SELLABLE / PURCHASABLE / STOCKABLE / CONSUMABLE）是 Identity 能参与的业务活动，不是 Identity 本身"
     
     - scope_id: "DS-008"
       item: "Identity 与 Role 的关系"
       status: "RESOLVED"
       conclusion: "Identity 独立于 Role。Role 是 Capability 在特定 Context 下的表现形式"
     
     - scope_id: "DS-009"
       item: "Identity 与 Profile 的关系"
       status: "RESOLVED"
       conclusion: "Identity 独立于 Profile。Profile 是 Identity 在特定 Context 的配置属性集（如 Procurement Profile / Inventory Profile）"
     
     - scope_id: "DS-010"
       item: "Identity 与 Relationship 的关系"
       status: "RESOLVED"
       conclusion: "Identity 独立于 Relationship。Relationship 是两个 Identity 之间的关联（如 Recipe ↔ Business Item）"
     
     - scope_id: "DS-011"
       item: "Identity 与 Packaging 的关系"
       status: "RESOLVED"
       conclusion: "Packaging 是 Context-specific 的商业/物流配置，不是 Identity 的一部分。330ml bottle 和 24-bottles case 是不同 Packaging，不改变 Identity"
     
     - scope_id: "DS-012"
       item: "Identity 与 UOM 的关系"
       status: "RESOLVED"
       conclusion: "UOM 是 Context-specific 的计量配置，不是 Identity 的一部分。采购用箱、生产用公斤、销售用个 — UOM 不改变 Identity"
     
     - scope_id: "DS-013"
       item: "Identity 与 SKU 的关系"
       status: "RESOLVED"
       conclusion: "SKU 是 Commercial Context 的唯一标识符，不是 Canonical Identity。同一 Canonical Identity 可以有多个 SKU（不同 Packaging / Channel）"
     
     - scope_id: "DS-014"
       item: "Identity 与 Barcode 的关系"
       status: "RESOLVED"
       conclusion: "Barcode 是 Context-specific Identifier，不是 Canonical Identity。同一 Canonical Identity 可以有多个 Barcode（不同供应商/批次）"
     
     - scope_id: "DS-015"
       item: "Identity 与 Supplier 的关系"
       status: "RESOLVED"
       conclusion: "Supplier 是 Procurement Context 的配置，不是 Identity 的一部分。同一 Canonical Identity 可以从多个 Supplier 采购"
     
     - scope_id: "DS-016"
       item: "Identity 与 Batch/Lot/Expiry 的关系"
       status: "RESOLVED"
       conclusion: "Batch/Lot/Expiry 是 Inventory Context 的事件属性，不是 Identity 的一部分。同一 Canonical Identity 可以有多个 Batch"
     
     - scope_id: "DS-017"
       item: "Identity 与 Store Scope 的关系"
       status: "RESOLVED"
       conclusion: "Store 是 Location Context，不是 Identity 的一部分。同一 Canonical Identity 可以在多个 Store 中存在"
     
     - scope_id: "DS-018"
       item: "Identity 生命周期语义"
       status: "RESOLVED"
       conclusion: "支持停用（Deactivate）和归档（Archive）。合并（Merge）需人工干预，不属于自动生命周期"

 # ============================================================================
 # 七、Identity Resolution Matrix (正式矩阵)
 # ============================================================================
 identity_resolution_matrix:
   description: |
     Same Identity 判断规则。每个属性变化是否导致 Identity 变化。
     
     规则来源：Evidence + Business Invariant + Counterexample
     
     注意：以下规则为 CANDIDATE IDENTITY RULES，待 Product Owner 确认

   resolution_rules:
     - attribute: "Brand"
       same_identity_if_changed: false
       rule_type: "IDENTITY_BOUNDARY"
       rationale: "Brand 是 Product Family 的归属属性。更换 Brand = 不同 Canonical Identity"
       evidence: "Coca-Cola vs Pepsi: 不同 Brand = 不同 Identity"
       status: "CANDIDATE (NOT CONFIRMED)"

     - attribute: "Product Family"
       same_identity_if_changed: false
       rule_type: "IDENTITY_BOUNDARY"
       rationale: "Product Family 是 Identity 的核心归属。Coca-Cola Classic vs Coca-Cola Zero = 不同 Identity"
       evidence: "Coca-Cola Classic 330ml vs Coca-Cola Zero 330ml: 同一 Brand, 不同 Product Family = 不同 Identity"
       status: "CANDIDATE (NOT CONFIRMED)"

     - attribute: "Specification (Size / Volume / Weight)"
       same_identity_if_changed: false
       rule_type: "IDENTITY_BOUNDARY"
       rationale: "Specification 是 Identity 的物理边界。330ml vs 500ml = 不同 Identity"
       evidence: "Coca-Cola 330ml vs Coca-Cola 500ml: 同一 Brand + 同一 Product Family, 不同 Specification = 不同 Identity"
       counterexample: "Coca-Cola 330ml (罐装) vs Coca-Cola 330ml (瓶装): 同一 Specification, 不同 Packaging = Same Identity"
       status: "CANDIDATE (NOT CONFIRMED)"

     - attribute: "Flavor / Variant"
       same_identity_if_changed: false
       rule_type: "IDENTITY_BOUNDARY"
       rationale: "Flavor/Variant 是 Identity 的业务变体。Coca-Cola Classic vs Coca-Cola Cherry = 不同 Identity"
       evidence: "Coca-Cola Classic 330ml vs Coca-Cola Cherry 330ml: 同一 Brand + 同一 Product Family + 同一 Specification, 不同 Flavor = 不同 Identity"
       status: "CANDIDATE (NOT CONFIRMED)"

     - attribute: "Packaging (Container Type)"
       same_identity_if_changed: true
       rule_type: "NOT_IDENTITY_BOUNDARY"
       rationale: "Packaging 是 Context-specific 配置，不是 Identity 边界。罐装 vs 瓶装 = Same Identity"
       evidence: "Coca-Cola 330ml (罐装) vs Coca-Cola 330ml (瓶装): 同一 Brand + 同一 Product Family + 同一 Specification = Same Identity"
       counterexample: "Coca-Cola 330ml (单罐) vs Coca-Cola 330ml × 24 (整箱): 不同 Packaging Configuration = 仍是 Same Identity, 但不同 SKU"
       status: "CANDIDATE (NOT CONFIRMED)"

     - attribute: "Pack Size (Items per Pack)"
       same_identity_if_changed: true
       rule_type: "NOT_IDENTITY_BOUNDARY"
       rationale: "Pack Size 是商业配置，不是 Identity 边界。单罐 vs 24 罐整箱 = Same Identity"
       evidence: "Coca-Cola 330ml 单罐 vs Coca-Cola 330ml × 24 整箱: 同一 Brand + 同一 Product Family + 同一 Specification = Same Identity"
       status: "CANDIDATE (NOT CONFIRMED)"

     - attribute: "UOM (Unit of Measure)"
       same_identity_if_changed: true
       rule_type: "NOT_IDENTITY_BOUNDARY"
       rationale: "UOM 是 Context-specific 计量配置，不是 Identity 边界。采购用箱、销售用罐 = Same Identity"
       evidence: "Coca-Cola 330ml: 采购 24 罐/箱, 销售 1 罐/个: Same Identity"
       status: "CANDIDATE (NOT CONFIRMED)"

     - attribute: "SKU"
       same_identity_if_changed: true
       rule_type: "NOT_IDENTITY_BOUNDARY"
       rationale: "SKU 是 Commercial Context 的标识符，不是 Canonical Identity。同一 Identity 可有多个 SKU"
       evidence: "Coca-Cola 330ml (SKU-A) vs Coca-Cola 330ml (SKU-B, 不同 Channel): Same Identity"
       status: "CANDIDATE (NOT CONFIRMED)"

     - attribute: "Barcode"
       same_identity_if_changed: true
       rule_type: "NOT_IDENTITY_BOUNDARY"
       rationale: "Barcode 是 Context-specific Identifier，不是 Canonical Identity"
       evidence: "Coca-Cola 330ml (Barcode-A, 供应商 X) vs Coca-Cola 330ml (Barcode-B, 供应商 Y): Same Identity"
       status: "CANDIDATE (NOT CONFIRMED)"

     - attribute: "Supplier"
       same_identity_if_changed: true
       rule_type: "NOT_IDENTITY_BOUNDARY"
       rationale: "Supplier 是 Procurement Context 的配置，不是 Identity 边界"
       evidence: "Coca-Cola 330ml (从 Supplier A 采购) vs Coca-Cola 330ml (从 Supplier B 采购): Same Identity"
       status: "CANDIDATE (NOT CONFIRMED)"

     - attribute: "Supplier Product Code"
       same_identity_if_changed: true
       rule_type: "NOT_IDENTITY_BOUNDARY"
       rationale: "Supplier Product Code 是 Supplier Context 的标识符，不是 Canonical Identity"
       evidence: "Coca-Cola 330ml (Supplier Code: SUP-001) vs Coca-Cola 330ml (Supplier Code: SUP-002): Same Identity"
       status: "CANDIDATE (NOT CONFIRMED)"

     - attribute: "Batch / Lot"
       same_identity_if_changed: true
       rule_type: "NOT_IDENTITY_BOUNDARY"
       rationale: "Batch/Lot 是 Inventory Context 的事件属性，不是 Identity 边界"
       evidence: "Coca-Cola 330ml (Batch 20260901) vs Coca-Cola 330ml (Batch 20260902): Same Identity"
       status: "CANDIDATE (NOT CONFIRMED)"

     - attribute: "Expiry Date"
       same_identity_if_changed: true
       rule_type: "NOT_IDENTITY_BOUNDARY"
       rationale: "Expiry Date 是 Inventory Context 的事件属性，不是 Identity 边界"
       evidence: "Coca-Cola 330ml (Expiry 2027-01) vs Coca-Cola 330ml (Expiry 2027-06): Same Identity"
       status: "CANDIDATE (NOT CONFIRMED)"

     - attribute: "Store"
       same_identity_if_changed: true
       rule_type: "NOT_IDENTITY_BOUNDARY"
       rationale: "Store 是 Location Context，不是 Identity 边界"
       evidence: "Coca-Cola 330ml (Store A) vs Coca-Cola 330ml (Store B): Same Identity"
       status: "CANDIDATE (NOT CONFIRMED)"

     - attribute: "Price"
       same_identity_if_changed: true
       rule_type: "NOT_IDENTITY_BOUNDARY"
       rationale: "Price 是 Commercial Context 的动态属性，不是 Identity 边界"
       evidence: "Coca-Cola 330ml (¥3) vs Coca-Cola 330ml (¥3.50, 不同门店): Same Identity"
       status: "CANDIDATE (NOT CONFIRMED)"

     - attribute: "Commercial Offer"
       same_identity_if_changed: true
       rule_type: "NOT_IDENTITY_BOUNDARY"
       rationale: "Commercial Offer 是 Sales Context 的配置，不是 Identity 边界"
       evidence: "Coca-Cola 330ml (正价) vs Coca-Cola 330ml (促销价): Same Identity"
       status: "CANDIDATE (NOT CONFIRMED)"

 # ============================================================================
 # 八、Case 002 重新检查 (Coca-Cola 330ml vs 500ml)
 # ============================================================================
 case_002_recheck:
   name: "Coca-Cola 330ml vs 500ml (多规格变体)"
   
   distinction:
     product_family: "Coca-Cola Classic"
     specification_330ml: "330ml, 铝罐, 碳酸饮料"
     specification_500ml: "500ml, 塑料瓶, 碳酸饮料"
     brand: "Coca-Cola"
     flavor: "Classic (原味)"
   
   identity_analysis:
     brand: "相同 (Coca-Cola)"
     product_family: "相同 (Coca-Cola Classic)"
     specification: "不同 (330ml vs 500ml)"
   
   identity_rule_applied: |
     DS-005: Specification 是 IDENTITY_BOUNDARY
     330ml vs 500ml = Specification 不同 = Different Identity
   
   conclusion: |
     Coca-Cola 330ml 和 Coca-Cola 500ml 是 **两个不同的 Canonical Identity**。
     
     它们共享：
     - Brand: Coca-Cola ✅
     - Product Family: Coca-Cola Classic ✅
     
     它们不同：
     - Specification: 330ml vs 500ml ❌
     
     因此：Different Canonical Identity。
     
     330ml 和 500ml 不是 "共享 Canonical Identity + 规格扩展"，
     而是 "同一 Product Family 下的两个不同 Canonical Identity"。

 # ============================================================================
 # 九、Case 003 重新检查 (单罐 vs 整箱)
 # ============================================================================
 case_003_recheck:
   name: "Coca-Cola 330ml 单罐 vs 24 罐整箱 (Case Packs)"
   
   distinction:
     identity: "Coca-Cola Classic 330ml"
     packaging_single: "单罐 (1 can, 330ml)"
     packaging_case: "整箱 (24 cans, 330ml each)"
     pack_size: "1 vs 24"
     uom: "罐 vs 箱"
     sku_single: "SKU-A (单罐)"
     sku_case: "SKU-B (整箱)"
     barcode_single: "6901234567890"
     barcode_case: "6901234567891"
   
   identity_analysis:
     brand: "相同 (Coca-Cola)"
     product_family: "相同 (Coca-Cola Classic)"
     specification: "相同 (330ml)"
     packaging: "不同 (单罐 vs 整箱)"
     pack_size: "不同 (1 vs 24)"
     uom: "不同 (罐 vs 箱)"
     sku: "不同 (SKU-A vs SKU-B)"
     barcode: "不同 (Barcode-A vs Barcode-B)"
   
   identity_rule_applied: |
     DS-011: Packaging 是 NOT_IDENTITY_BOUNDARY → Same Identity
     DS-012: Pack Size 是 NOT_IDENTITY_BOUNDARY → Same Identity
     DS-012: UOM 是 NOT_IDENTITY_BOUNDARY → Same Identity
     DS-013: SKU 是 NOT_IDENTITY_BOUNDARY → Same Identity
     DS-014: Barcode 是 NOT_IDENTITY_BOUNDARY → Same Identity
   
   conclusion: |
     Coca-Cola 330ml 单罐 和 Coca-Cola 330ml × 24 整箱 是 **同一个 Canonical Identity**。
     
     它们共享：
     - Brand: Coca-Cola ✅
     - Product Family: Coca-Cola Classic ✅
     - Specification: 330ml ✅
     
     它们不同：
     - Packaging: 单罐 vs 整箱 (NOT Identity Boundary)
     - Pack Size: 1 vs 24 (NOT Identity Boundary)
     - UOM: 罐 vs 箱 (NOT Identity Boundary)
     - SKU: SKU-A vs SKU-B (NOT Identity Boundary)
     - Barcode: Barcode-A vs Barcode-B (NOT Identity Boundary)
     
     因此：Same Canonical Identity。
     
     但它们是不同的：
     - **SKU** (商业标识符)
     - **Barcode** (条码标识符)
     - **Purchase Unit** (采购单位: 箱)
     - **Stock Unit** (库存单位: 罐)
     - **Sales Unit** (销售单位: 罐 或 箱)
     
     这些差异属于 Context-specific Profile，不是 Identity 差异。

