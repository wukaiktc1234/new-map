      evidence: "upstream-dependency-map.md §4.2: 销售链路涉及支付"

  what_depends_on_payment_method:
    - "POS 终端的支付方式选择"
    - "小程序的在线支付集成"
    - "财务对账（按支付方式统计收入）"
    - "资金流水（按支付方式分类）"
    - "退款处理（原路返回）"
    - "会员支付（余额/积分抵扣）"
    - "支付渠道管理（微信/支付宝商户号）"

# ============================================================================
# 四、选项分析
# ============================================================================
options:
  A_enum:
    name: "保持枚举/硬编码（Enum）"
    description: "支付方式作为代码中的枚举值"
    schema: |
      // Java 枚举
      public enum PaymentMethod {
        CASH("现金"),
        WECHAT("微信支付"),
        ALIPAY("支付宝"),
        MEMBER("会员支付"),
        BANK_CARD("银行卡")
      }
    pros:
      - "最简单，无额外维护"
      - "类型安全，编译时检查"
      - "适用于固定支付方式集合"
    cons:
      - "新增支付方式需改代码并重新部署"
      - "无法分门店配置不同支付方式"
      - "支付方式与财务科目映射硬编码"
      - "无法审计支付方式变更历史"
      - "与 foundation-map.md 的 MISSING 标记一致"
    effort: NONE
    risk: MEDIUM
    affected_domains: [POS, Finance, Marketing]
    migration_needed: false
    limitation: "无法动态扩展，不支持分门店配置"

  B_independent_table:
    name: "创建 payment_methods 独立表（Master Data）"
    description: "PaymentMethod 作为独立的 Foundation Object"
    schema: |
      CREATE TABLE payment_methods (
        id BIGINT PRIMARY KEY AUTO_INCREMENT,
        code VARCHAR(50) UNIQUE NOT NULL,       -- 支付方式编码
        name VARCHAR(100) NOT NULL,             -- 支付方式名称
        type VARCHAR(20),                       -- 类型: CASH/CARD/ONLINE/MEMBER
        accountingSubjectId BIGINT,             -- 关联会计科目
        externalProvider VARCHAR(50),           -- 外部支付提供商
        config JSON,                            -- 配置信息（商户号等）
        sortOrder INT DEFAULT 0,               -- 排序
        status INT DEFAULT 1,
        created_at TIMESTAMP DEFAULT NOW()
      );
      -- 示例数据
      -- (1, 'CASH', '现金', 'CASH', NULL, NULL, '{}', 1)
      -- (2, 'WECHAT', '微信支付', 'ONLINE', 1001, 'WECHAT', '{"mchId":"xxx"}', 2)
      -- (3, 'ALIPAY', '支付宝', 'ONLINE', 1002, 'ALIPAY', '{"pid":"xxx"}', 3)
      -- (4, 'MEMBER', '会员支付', 'MEMBER', 1003, NULL, '{}', 4)
    pros:
      - "统一管理所有支付方式"
      - "可动态添加/停用支付方式"
      - "支持分门店配置"
      - "支付方式与财务科目可配置"
      - "支持外部支付提供商配置"
      - "Foundation 设计一致"
    cons:
      - "增加数据维护成本"
      - "查询时需要 JOIN payment_methods 表"
      - "支付渠道配置增加运维复杂度"
    effort: MEDIUM
    risk: LOW
    affected_domains: [POS, Finance, Marketing, Order]
    affected_objects: [orders, payment, receipt, fund_flows]
    migration_needed: true
    migration_complexity: MEDIUM

  C_configuration:
    name: "作为系统配置项（Configuration）"
    description: "支付方式作为系统配置，通过管理界面配置"
    schema: |
      -- 在 system_config 表中存储
      CREATE TABLE system_config (
        config_key VARCHAR(100) PRIMARY KEY,
        config_value TEXT,
        config_type VARCHAR(20)
      );
      INSERT INTO system_config VALUES
        ('payment.methods', '[
          {"code":"CASH","name":"现金","enabled":true},
          {"code":"WECHAT","name":"微信支付","enabled":true,"mchId":"xxx"},
          {"code":"ALIPAY","name":"支付宝","enabled":true,"pid":"xxx"}
        ]', 'JSON');
    pros:
      - "可通过管理界面配置"
      - "无需改代码"
      - "可分门店配置不同支付方式"
    cons:
      - "配置管理增加运维复杂度"
      - "配置分散在 JSON 中，查询不便"
      - "无法审计配置变更历史"
      - "配置与业务逻辑耦合"
    effort: LOW
    risk: MEDIUM
    affected_domains: [POS, Finance]
    migration_needed: false
    limitation: "查询不便，配置与业务逻辑耦合"

  D_external_provider:
    name: "外部支付提供商定义（External Payment Provider）"
    description: "支付方式由外部支付渠道定义，系统只记录引用"
    schema: |
      -- 只记录外部支付ID
      CREATE TABLE order_payments (
        id BIGINT PRIMARY KEY AUTO_INCREMENT,
        orderId BIGINT REFERENCES orders(id),
        externalPaymentId VARCHAR(100),  -- 外部支付ID
        provider VARCHAR(50),            -- WECHAT/ALIPAY
        amount DECIMAL(10,2),
        status VARCHAR(20),
        rawResponse JSON                 -- 外部返回原始数据
      );
    pros:
      - "与外部支付系统解耦"
      - "支持多种支付渠道"
      - "原始数据可追溯"
    cons:
      - "无法统一管理支付方式"
      - "财务对账需额外逻辑"
      - "现金支付无法表达"
    effort: MEDIUM
    risk: MEDIUM
    affected_domains: [POS, Finance]
    migration_needed: true
    limitation: "不支持现金/会员等非外部支付方式"

  E_hybrid:
    name: "混合模式（独立表 + 外部提供商配置）"
    description: "支付方式独立管理，同时支持外部提供商配置"
    schema: |
      CREATE TABLE payment_methods (
        id BIGINT PRIMARY KEY AUTO_INCREMENT,
        code VARCHAR(50) UNIQUE NOT NULL,
        name VARCHAR(100) NOT NULL,
        type VARCHAR(20),                      -- CASH/CARD/ONLINE/MEMBER
        accountingSubjectId BIGINT,             -- 关联会计科目
        requiresExternal BOOLEAN DEFAULT false, -- 是否需要外部支付
        status INT DEFAULT 1,
        created_at TIMESTAMP DEFAULT NOW()
      );
      CREATE TABLE payment_method_configs (
        id BIGINT PRIMARY KEY AUTO_INCREMENT,
        paymentMethodId BIGINT REFERENCES payment_methods(id),
        storeId BIGINT,                        -- 门店级配置（NULL=全局）
        configKey VARCHAR(100),
        configValue TEXT,
        UNIQUE(paymentMethodId, storeId, configKey)
      );
    pros:
      - "统一管理支付方式"
      - "支持外部支付渠道配置"
      - "支持分门店配置"
      - "支付方式与财务科目可配置"
    cons:
      - "复杂度较高"
      - "配置管理增加运维工作"
    effort: HIGH
    risk: LOW
    affected_domains: [POS, Finance, Marketing, Order]
    migration_needed: true
    migration_complexity: HIGH

# ============================================================================
# 五、支付方式与财务科目映射
# ============================================================================
accounting_subject_mapping:
  description: "每种支付方式需要映射到财务科目"
  examples:
    - payment_method: "现金"
      accounting_subject: "1001-库存现金"
    - payment_method: "微信支付"
      accounting_subject: "1002-银行存款-微信"
    - payment_method: "支付宝"
      accounting_subject: "1003-银行存款-支付宝"
    - payment_method: "会员支付"
      accounting_subject: "2001-预收账款-会员储值"
  impact: "支付方式变更可能影响财务科目映射"

# ============================================================================
# 六、退款与支付方式关系
# ============================================================================
refund_relationship:
  description: "退款需原路返回到原始支付方式"
  scenarios:
    - payment_method: "微信支付"
      refund_behavior: "调用微信退款API，原路返回"
    - payment_method: "支付宝"
      refund_behavior: "调用支付宝退款API，原路返回"
    - payment_method: "现金"
      refund_behavior: "现金退还"
    - payment_method: "会员支付"
      refund_behavior: "退回会员余额"
  impact: "退款处理需知道原始支付方式"

# ============================================================================
# 七、推荐方案
# ============================================================================
recommendation:
  primary: A_enum
  short_term_rationale: |
    1. 当前阶段支付方式固定（现金/微信/支付宝/会员/银行卡）
    2. 无分门店配置需求
    3. 改动最小，风险最低
    4. 如果未来需要动态扩展，再升级为 B 或 E
  conditions_to_upgrade:
    - "需要动态添加新支付方式"
    - "需要分门店配置不同支付方式"
    - "支付方式与财务科目需要可配置"
  long_term: E_hybrid
  long_term_condition: "当支付渠道增多或需要分门店配置时"

