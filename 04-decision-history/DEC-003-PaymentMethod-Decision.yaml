# ============================================================================
# DEC-003: PaymentMethod Decision
# ============================================================================
# 决策编号: DEC-003
# 决策标题: PaymentMethod 管理模式
# 决策类别: Foundation
# 生成日期: 2026-09-09
# 状态: OPEN
# 优先级: P1 (影响支付流程完整性)
# ============================================================================

meta:
  id: DEC-003
  title: "PaymentMethod 对象归属与定义"
  category: FOUNDATION
  status: OPEN
  priority: P1
  blocking: false
  generated_from:
    - foundation-map.md §17
    - business-object-map.md §13-14
    - upstream-dependency-map.md §5.3
    - business-data-flow-map.md §2.3
    - db-reality-map.md §8-9
    - cross-domain-coordination-matrix.md §2.1

# ============================================================================
# 一、问题定义
# ============================================================================
question: |
  PaymentMethod（支付方式）到底是什么？
  - Master Data（主数据，需要独立管理表）
  - Configuration（配置项，系统级配置）
  - Enum（枚举，代码中硬编码）
  - Finance Policy（财务策略，与支付渠道绑定）
  - External Payment Provider（外部支付提供商，由第三方定义）

# ============================================================================
# 二、当前现实
# ============================================================================
current_reality:
  truth_source: "无独立表 — 可能存储在 orders 或 payment 表字段中"
  evidence:
    - location: "foundation-map.md §17"
      finding: "PaymentMethod 标记为 MISSING FOUNDATION，可能是枚举值"
    - location: "business-data-flow-map.md §2.3"
      finding: "PaymentDialog 中 paymentMethod 从 supplier.settlementMethod 推导"
    - location: "db-reality-map.md §8"
      finding: "orders 表有 payment_status 字段，但无 payment_method 字段"
    - location: "db-reality-map.md §9"
      finding: "payment 表记录付款信息，但无支付方式定义"
    - location: "cross-domain-coordination-matrix.md"
      finding: "支付方式影响 POS、Mini Program、Finance 多个域"
  confidence: LOW
  current_implementation:
    known_payment_methods:
      - "现金 (Cash)"
      - "微信支付 (WeChat Pay)"
      - "支付宝 (Alipay)"
      - "会员支付 (Member Payment)"
      - "银行卡 (Bank Card)"
    storage_location: "可能在代码枚举中，或在 orders/payment 表的某个字段"
    external_integrations:
      - "微信支付 API (api-map.md §6)"
      - "支付宝 API (api-map.md §6)"
      - "会员余额支付 (member_points_log / recharge_record)"
  problem_indicators:
    - "支付方式定义分散，无统一管理"
    - "新增支付方式需改代码"
    - "不同门店可能支持不同支付方式，无法配置"
    - "支付方式与财务科目映射不明确"
    - "退款时支付方式的处理逻辑不清晰"

# ============================================================================
# 三、依赖关系分析
# ============================================================================
dependency_analysis:
  dependencies_on_payment_method:
    - domain: POS (收银终端)
      entity: Order
      relationship: "下单时选择支付方式"
      impact: "POS 终端需展示可用支付方式"
      evidence: "cross-domain-coordination-matrix.md §2.1: Order 的 POS 角色为 OWNER"
    - domain: Mini Program (小程序)
      entity: Order
      relationship: "在线下单时选择支付方式"
      impact: "小程序需集成微信/支付宝支付"
      evidence: "cross-domain-coordination-matrix.md §2.1: Mini Program 为 WRITE"
    - domain: Finance (财务管理)
      entity: Payment (付款)
      relationship: "付款记录需关联支付方式"
      impact: "财务对账需按支付方式统计"
      evidence: "business-data-flow-map.md §2.3: PaymentDialog 需要 paymentMethod"
    - domain: Finance
      entity: Receipt (收款)
      relationship: "收款记录需关联支付方式"
      impact: "收款对账需按支付方式分类"
