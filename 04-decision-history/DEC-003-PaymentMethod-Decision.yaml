      evidence: "business-object-map.md §12: FundFlow.Dependencies 包含 BankAccount"
    - domain: Finance
      entity: FinanceRecord (财务流水)
      relationship: "财务记录需关联支付方式"
      impact: "财务报表需按支付方式分类"
      evidence: "business-object-map.md §11: FinanceRecord.Dependencies 包含 Voucher"
    - domain: Marketing (营销)
      entity: Member (会员)
