# ============================================================
# 食品溯源系统 - 测试环境配置 (PostgreSQL)
# ============================================================
# 用途: Spring Boot 集成测试
# 数据库: PostgreSQL（与开发/生产环境一致，通过 Flyway 管理表结构）
# 注意: 运行测试前需启动本地 PostgreSQL，并创建 food_traceability_test 数据库
# ============================================================

spring:
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB_NAME:food_traceability_test}?currentSchema=public&useUnicode=true&characterEncoding=utf-8&sslmode=disable
    username: ${PG_USERNAME:postgres}
    password: ${PG_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: PgTestPool
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  mybatis-plus:
    mapper-locations: classpath:mapper/**/*.xml
    type-aliases-package: com.foodtraceability.entity
    configuration:
      map-underscore-to-camel-case: true
      lazy-loading-enabled: false
      aggressive-lazy-loading: false
      local-cache-scope: STATEMENT
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
      banner: false
      db-config:
        id-type: ASSIGN_ID
        field-strategy: NOT_EMPTY
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0

  # Flyway 测试环境也启用，通过迁移脚本管理表结构
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: false
    placeholder-replacement: false
    out-of-order: true
    validate-on-migrate: false
    ignore-missing-migrations: true

  cache:
    type: none

  web:
    resources:
      add-mappings: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write_dates_as_timestamps: false
      write-dates-as-timestamps: false
    deserialization:
      fail_on_unknown_properties: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

jwt:
  secret: dev-only-not-for-production-use-this-key-must-be-at-least-64-bytes-long-for-hs512-algorithm-security
  access-token-expiration: 7200000
  refresh-token-expiration: 2592000000
  refresh-window: 3600000
  header: Authorization
  prefix: Bearer

logging:
  level:
    root: WARN
    com.foodtraceability: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.mybatis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 0
  servlet:
    context-path: /api
