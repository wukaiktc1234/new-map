# ============================================================
# 食品溯源系统 - 开发环境配置 (PostgreSQL)
# ============================================================
# 用法: mvn spring-boot:run -Dspring-boot.run.profiles=pg
# 或: 复制为 application.yml 的默认profile
# ============================================================

# 真实业务验收测试期间关闭定时任务，避免 Java 21 + Windows 平台 JVM 崩溃
# 同时减少非必要日志，便于聚焦采购-仓储-库存-财务链路
app:
  scheduling:
    enabled: false

scheduler:
  enabled: false

spring:
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB_NAME:food_traceability}?currentSchema=public&useUnicode=true&characterEncoding=utf-8&sslmode=disable
    username: ${PG_USERNAME:postgres}
    # 开发环境默认密码 123456（仅本地 PostgreSQL 测试，生产环境必须通过 PG_PASSWORD 环境变量注入强密码）
    password: ${PG_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: PgDevPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 180000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  mybatis-plus:
    mapper-locations: classpath:mapper/**/*.xml
    type-aliases-package: com.foodtraceability.entity
    configuration:
      map-underscore-to-camel-case: true
      lazy-loading-enabled: true
      aggressive-lazy-loading: false
      local-cache-scope: STATEMENT
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
      banner: false
      db-config:
        id-type: ASSIGN_ID
        field-strategy: NOT_EMPTY
        logic-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0

  # Flyway 开发环境也启用（便于调试迁移脚本）
  # V20260629_008 脚本 bug 已修复（补充 purchase_order_items.create_time 列），恢复启用
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
    placeholder-replacement: false
    out-of-order: true
    validate-on-migrate: false
    repair-on-migrate: true
    ignore-missing-migrations: true

server:
  port: 8081
  servlet:
    context-path: /api

jwt:
  # 开发环境默认 JWT 密钥（仅本地 PostgreSQL 测试，生产环境必须通过 JWT_SECRET 环境变量注入强随机密钥）
  secret: ${JWT_SECRET:dev-only-not-for-production-use-this-key-must-be-at-least-64-bytes-long-for-hs512-algorithm-security}
  access-token-expiration: 7200000
  refresh-token-expiration: 2592000000

logging:
  level:
    root: WARN
    com.foodtraceability: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n"
