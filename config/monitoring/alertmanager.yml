global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@yourdomain.com'
  smtp_auth_username: 'alerts@yourdomain.com'
  smtp_auth_password: 'your-smtp-password'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'
    - match:
        category: security
      receiver: 'security-team'

receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://backend:8081/api/v1/monitoring/alerts'
        send_resolved: true

  - name: 'critical-alerts'
    email_configs:
      - to: 'ops-team@yourdomain.com'
        headers:
          Subject: '[严重告警] 食品溯源系统 - {{ .GroupLabels.alertname }}'
        html: |
          <h2>严重告警通知</h2>
          <p><strong>告警名称:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>严重程度:</strong> {{ .GroupLabels.severity }}</p>
          <p><strong>详情:</strong></p>
          {{ range .Alerts }}
          <ul>
            <li>{{ .Annotations.summary }}</li>
            <li>{{ .Annotations.description }}</li>
          </ul>
          {{ end }}
    webhook_configs:
      - url: 'http://backend:8081/api/v1/monitoring/alerts/critical'
        send_resolved: true

  - name: 'warning-alerts'
    email_configs:
      - to: 'ops-team@yourdomain.com'
        headers:
          Subject: '[警告] 食品溯源系统 - {{ .GroupLabels.alertname }}'

  - name: 'security-team'
    email_configs:
      - to: 'security@yourdomain.com'
        headers:
          Subject: '[安全告警] 食品溯源系统 - {{ .GroupLabels.alertname }}'
    webhook_configs:
      - url: 'http://backend:8081/api/v1/monitoring/alerts/security'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
