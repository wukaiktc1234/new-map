# ============================================================
# 食品溯源系统 - Nginx 生产环境配置
# 包含: DDoS防护、HTTPS强制、安全头、反向代理
# ============================================================

# DDoS 防护 - 限流区域定义
# 放在 http 块内
limit_req_zone $binary_remote_addr zone=ddos_global:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ddos_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=ddos_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# 上游服务器定义
upstream backend_api {
    server 127.0.0.1:8081;
    keepalive 32;
}

upstream frontend_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP 服务器 - 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;
    
    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # 其他所有请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 服务器
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;
    
    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    
    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';" always;
    
    # 隐藏 Nginx 版本
    server_tokens off;
    
    # 日志配置
    access_log /var/log/nginx/food-traceability.access.log;
    error_log /var/log/nginx/food-traceability.error.log;
    
    # 根目录
    root /var/www/frontend/dist;
    index index.html;
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_comp_level 6;
    
    # 全局连接限制
    limit_conn conn_limit 50;
    
    # API 接口 - 带 DDoS 防护
    location /api/ {
        # DDoS 防护：每IP每秒最多10个请求
        limit_req zone=ddos_api burst=20 nodelay;
        limit_req_status 429;
        
        # 连接限制：每IP最多20个并发连接
        limit_conn conn_limit 20;
        limit_conn_status 429;
        
        proxy_pass http://backend_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # 登录接口 - 更严格的限流
    location /api/v1/auth/login {
        # 登录接口：每IP每分钟最多5次请求
        limit_req zone=ddos_login burst=3 nodelay;
        limit_req_status 429;
        
        # 连接限制
        limit_conn conn_limit 5;
        limit_conn_status 429;
        
        proxy_pass http://backend_api/v1/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # 超时配置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # 静态资源 - 带缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        limit_req zone=ddos_global burst=50 nodelay;
    }
    
    # 前端路由 - SPA 支持
    location / {
        limit_req zone=ddos_global burst=30 nodelay;
        try_files $uri $uri/ /index.html;
    }
    
    # 健康检查端点
    location /api/v1/health {
        access_log off;
        proxy_pass http://backend_api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 禁止访问敏感文件
    location ~* \.(env|git|svn|htaccess|htpasswd|log|sql|bak|backup|old)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 自定义错误页面
    error_page 429 /429.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /429.html {
        root /var/www/error-pages;
        internal;
    }
    
    location = /50x.html {
        root /var/www/error-pages;
        internal;
    }
}

# ============================================================
# 配置说明
# ============================================================
# 
# 1. DDoS 防护层级：
#    - 全局限流：30请求/秒/IP
#    - API接口：10请求/秒/IP，突发20
#    - 登录接口：5请求/分钟/IP，突发3（防暴力破解）
#    - 连接限制：50并发连接/IP
#
# 2. 部署步骤：
#    a) 创建限流区域目录
#    b) 配置 SSL 证书
#    c) 创建错误页面目录
#    d) 测试配置: nginx -t
#    e) 重载配置: nginx -s reload
#
# 3. 监控命令：
#    - 查看连接状态: nginx -s status
#    - 查看限流状态: tail -f /var/log/nginx/error.log | grep limiting
#
# 4. 调优建议：
#    - 根据实际QPS调整 rate 值
#    - 根据服务器内存调整 zone 大小
#    - 生产环境建议配合 WAF 使用
# ============================================================
