reconciliation_rules:
  identity_resolution:
    - rule_id: "IR-001"
      description: "Each concept must have a unique canonical identity"
      implementation: "Natural key or surrogate key with business meaning"
      examples:
        - "ProductCode for Product"
        - "FoodCode for Food"
        - "SKUCode for SKU"
    - rule_id: "IR-002"
      description: "Identities must be stable across system boundaries"
      implementation: "Global uniqueness with namespace prefix"
      examples:
        - "GLOBAL-PROD-001"
        - "STORE-FOOD-001"
    - rule_id: "IR-003"
      description: "Identities must support human readability"
      implementation: "Meaningful prefixes and sequential numbering"
      examples:
        - "PROD-001-牛肉"
        - "SKU-002-可乐"

  type_role_capability_distinction:
    - distinction: "Type defines WHAT something is"
      examples:
        - "Food is a type of Product"
        - "Beverage is a type of Product"
    - distinction: "Role defines HOW something is used"
      examples:
        - "Sellable role for customer-facing items"
        - "Purchasable role for supplier-sourced items"
    - distinction: "Capability defines WHAT something can do"
      examples:
        - "Stockable capability for inventory management"
        - "Consumable capability for usage tracking"

  candidate_model_comparison:
    - model: "Single Product Table"
      pros:
        - "Simple implementation"
        - "Easy querying"
      cons:
        - "Overloaded columns"
        - "Poor domain separation"
      verdict: "NOT_RECOMMENDED"
    - model: "Type-Specific Tables"
      pros:
        - "Clear domain separation"
        - "Type-specific attributes"
